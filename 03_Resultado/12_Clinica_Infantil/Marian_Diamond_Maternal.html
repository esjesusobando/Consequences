<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>U.E.P. Marian Diamond · Inscripciones 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --secondary: #06B6D4;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1a1a2e;
            color: white;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== HERO STICKY ========== */
        .hero {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1;
        }

        .hero-image-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* Gradient oscuro en la parte baja de la imagen */
        .hero-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0.2) 40%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 3;
        }

        /* ========== CONTENT - SCROLLEA SOBRE LA IMAGEN ========== */
        .content {
            position: relative;
            z-index: 10;
            padding: 0 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 500px;
            margin: -20vh auto 0;
            background: transparent;
        }

        /* ========== INFO CARD ========== */
        .info-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1rem;
        }

        .info-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.15rem;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
        }

        /* ========== BUTTONS ========== */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.25rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
            min-height: 50px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.45);
        }

        .btn-social {
            background: linear-gradient(135deg, var(--secondary) 0%, #0891b2 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(6, 182, 212, 0.35);
        }

        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(6, 182, 212, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-social .social-icon-tiktok {
            width: 20px;
            height: 20px;
        }

        /* ========== RESPONSIVE ========== */
        @media (min-width: 768px) {
            .content {
                padding: 0 2rem 4rem;
                gap: 1.25rem;
            }

            .buttons {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .buttons .btn {
                flex: 1;
                min-width: 160px;
            }

            .btn {
                min-height: 54px;
                font-size: 0.9rem;
            }

            .info-card {
                border-radius: 1.25rem;
            }

            .info-row {
                padding: 1rem 1.25rem;
                gap: 1rem;
            }
        }
    </style>
</head>
