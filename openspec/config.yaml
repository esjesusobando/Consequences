schema: spec-driven

context: |
  Tech stack: Python 3.14.2 (stdlib only), Markdown templates, JSON persistence
  Architecture: CLI scripts with flat-file persistence (no DB)
  Testing: pytest or manual validation
  Style: Unix-style CLI, argparse, English technical artifacts

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep specs under 650 words each
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
