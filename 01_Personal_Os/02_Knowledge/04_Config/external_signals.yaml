# External Signals Configuration
# ================================
# PersonalOS v5.0 — Gap 3: External Feedback Loop
#
# API keys go in .env file, NOT here.
# Copy .env.example to .env and fill in your credentials.
#
# Set enabled: true for sources you want to track.
# Each source requires its corresponding env var in .env.

sources:
  linkedin:
    enabled: false
    account_id: ""
    # Requires: LINKEDIN_ACCESS_TOKEN in .env

  twitter:
    enabled: false
    account_id: ""
    # Requires: TWITTER_BEARER_TOKEN in .env

  youtube:
    enabled: false
    channel_id: ""
    # Requires: YOUTUBE_API_KEY in .env

  blog:
    enabled: false
    url: ""
    # Requires: BLOG_ANALYTICS_URL in .env

  newsletter:
    enabled: false
    provider: ""
    # Requires: NEWSLETTER_API_KEY in .env
