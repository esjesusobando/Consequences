name: "Prototype Pipeline"
description: "Crea prototipo funcional desde una idea"
trigger: "crear prototipo"
timeout_per_step: 120
steps:
  - name: "hypothesis"
    command: "prototype_studio.py hypothesis --idea {idea}"
    required: true
    timeout: 60
  - name: "build"
    command: "prototype_studio.py build --hypothesis-id {hypothesis_id} --brand {brand}"
    required: true
    timeout: 120
  - name: "test"
    command: "prototype_studio.py test --prototype-id {prototype_id}"
    required: true
    timeout: 60
  - name: "labs"
    command: "prototype_studio.py labs --prototype-id {prototype_id}"
    required: false
    timeout: 90
