name: "Content Creation"
description: "Crea contenido completo desde cero — draft, humanizacion, review, publicacion"
trigger: "crear contenido sobre"
timeout_per_step: 120
steps:
  - name: "draft_generator"
    command: "content_pipeline.py draft --topic {topic} --platform {platform}"
    required: true
    timeout: 120
  - name: "humanizador"
    command: "humanizador --input {prev_output}"
    required: true
    timeout: 60
  - name: "review_draft"
    command: "review_draft --input {prev_output}"
    required: true
    timeout: 60
  - name: "publish"
    command: "content_pipeline.py publish --input {prev_output} --platform {platform}"
    required: false
    timeout: 90
