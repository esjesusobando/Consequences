| 1 | **TDD Pipeline** | 7 | Core Flow: 00→01→02→03→04→05→06→07 |
| 2 | **Dream Team** | 5 | Paralelo: Product, Data, Marketing, Design, Platform |
| 3 | **Compound Review** | N | Parall: Security → Performance → A11y |
| 4 | **Growth** | 5 | Secuencial: Script → Thumbnail → Title → Content → Carousel |
